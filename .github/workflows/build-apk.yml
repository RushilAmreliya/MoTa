name: Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify APK exists
        run: |
          ls -lh release/MoTA-Scholarship-Portal.apk
          echo "APK size: $(du -sh release/MoTA-Scholarship-Portal.apk | cut -f1)"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoTA-Scholarship-Portal-APK
          path: release/MoTA-Scholarship-Portal.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "📱 MoTA Scholarship Portal v1.0.0"
          body: |
            ### 📱 MoTA Unified Scholarship Portal

            Download and install directly on any Android device (Android 7.0+).

            **Installation steps:**
            1. Download `MoTA-Scholarship-Portal.apk` below
            2. On your phone, go to Settings → Install unknown apps → Allow
            3. Open the downloaded APK and tap Install

            ---
            - **Package**: `gov.mota.scholarship`
            - **Min Android**: 7.0 (API 24)
            - **Signed**: Debug keystore (v2 scheme)
            - **Features**: Multilingual JAGO AI Assistant, DigiLocker Zero-Upload Wallet, Biometric Auth, Pre-Submission Document Scanner, Household Sync
          files: release/MoTA-Scholarship-Portal.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

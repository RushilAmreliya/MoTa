name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p release_apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release_apk/MoTA-Scholarship-Portal.apk \; || \
          find app/build/intermediates/apk/ -name "*.apk" -exec cp {} release_apk/MoTA-Scholarship-Portal.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoTA-Scholarship-Portal-APK
          path: release_apk/MoTA-Scholarship-Portal.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "MoTA Unified Scholarship Portal v1.0.0 (Release APK)"
          body: |
            ### 📱 MoTA Scholarship Android Application
            Download the standalone APK below and install directly on any Android device (Android 7.0+).
            
            - **Package**: `gov.mota.scholarship`
            - **Includes**: Multilingual JAGO AI Assistant, DigiLocker Zero-Upload Wallet, Biometric Auth, Pre-Submission Document Scanner, and Household Sync.
          files: release_apk/MoTA-Scholarship-Portal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
